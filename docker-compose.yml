services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nz_job_market}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Round 15 (M-7): fail startup when the password is unset or the old default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a non-default value}
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nzjm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nz_job_market}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: Host=postgres;Port=5432;Database=${POSTGRES_DB:-nz_job_market};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a non-default value}
      # Round 13: shared secret gating /api/admin/health. Empty means fail closed.
      HEALTH_ACCESS_PASSWORD: ${HEALTH_ACCESS_PASSWORD:-}
      # Only the compose nginx network may set X-Forwarded-For/Proto.
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-172.30.0.0/24}
      AI_EXTRACTION_ENABLED: ${AI_EXTRACTION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_EXTRACTION_BATCH_SIZE: ${AI_EXTRACTION_BATCH_SIZE:-10}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev/v2}
      FIRECRAWL_TIMEOUT_SECONDS: ${FIRECRAWL_TIMEOUT_SECONDS:-60}
      SCRAPLING_FETCHER_TYPE: ${SCRAPLING_FETCHER_TYPE:-fetcher}
      SCRAPLING_PYTHON_EXECUTABLE: python3
      SCRAPLING_WORKER_SCRIPT: ${SCRAPLING_WORKER_SCRIPT:-}
      SCRAPLING_ROBOTS_TXT_OBEY: "true"
      SCRAPLING_TIMEOUT_SECONDS: ${SCRAPLING_TIMEOUT_SECONDS:-360}
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      CRAWLER_JOB_STALE_DAYS: ${CRAWLER_JOB_STALE_DAYS:-15}
      CRAWLER_MISSING_CRAWL_THRESHOLD: ${CRAWLER_MISSING_CRAWL_THRESHOLD:-2}
      CRAWLER_MAX_PAGES_PER_RUN: ${CRAWLER_MAX_PAGES_PER_RUN:-50}
      CRAWLER_RETENTION_DAYS: ${CRAWLER_RETENTION_DAYS:-20}
      SCRAPLING_DOWNLOAD_DELAY_SECONDS: ${SCRAPLING_DOWNLOAD_DELAY_SECONDS:-5}
    ports:
      - "5050:8080"
    networks:
      - nzjm
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    networks:
      - nzjm
    depends_on:
      - backend

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    environment:
      DATABASE_URL: Host=postgres;Port=5432;Database=${POSTGRES_DB:-nz_job_market};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a non-default value}
      AI_EXTRACTION_ENABLED: ${AI_EXTRACTION_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_EXTRACTION_BATCH_SIZE: ${AI_EXTRACTION_BATCH_SIZE:-10}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      FIRECRAWL_BASE_URL: ${FIRECRAWL_BASE_URL:-https://api.firecrawl.dev/v2}
      FIRECRAWL_TIMEOUT_SECONDS: ${FIRECRAWL_TIMEOUT_SECONDS:-60}
      SCRAPLING_FETCHER_TYPE: ${SCRAPLING_FETCHER_TYPE:-fetcher}
      SCRAPLING_PYTHON_EXECUTABLE: python3
      SCRAPLING_WORKER_SCRIPT: ${SCRAPLING_WORKER_SCRIPT:-}
      SCRAPLING_ROBOTS_TXT_OBEY: "true"
      SCRAPLING_TIMEOUT_SECONDS: ${SCRAPLING_TIMEOUT_SECONDS:-360}
      SCRAPLING_PROXY_URL: ${SCRAPLING_PROXY_URL:-}
      CRAWLER_JOB_STALE_DAYS: ${CRAWLER_JOB_STALE_DAYS:-15}
      CRAWLER_MISSING_CRAWL_THRESHOLD: ${CRAWLER_MISSING_CRAWL_THRESHOLD:-2}
      CRAWLER_MAX_PAGES_PER_RUN: ${CRAWLER_MAX_PAGES_PER_RUN:-50}
      CRAWLER_RETENTION_DAYS: ${CRAWLER_RETENTION_DAYS:-20}
      SCRAPLING_DOWNLOAD_DELAY_SECONDS: ${SCRAPLING_DOWNLOAD_DELAY_SECONDS:-5}
      CRAWLER_DELAY_SECONDS: ${CRAWLER_DELAY_SECONDS:-30}
      CRAWLER_POLL_SECONDS: ${CRAWLER_POLL_SECONDS:-60}
    networks:
      - nzjm
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  nzjm:
    ipam:
      config:
        - subnet: 172.30.0.0/24
