[project]
name = "nz-job-market-crawler"
version = "0.1.0"
description = "Scrapling crawler worker for the NZ Job Market Intelligence Dashboard"
requires-python = ">=3.11"
dependencies = [
  # Round 17: pin the browser stack. Scrapling 0.5 removed DynamicFetcher and
  # unpinned rebuilds produced a patchright that expected chromium-1243 while
  # the image only shipped chromium-1248. 0.4.15 keeps both fetchers and the
  # exact playwright/patchright versions below both resolve to chromium-1248.
  "scrapling[fetchers]==0.4.15",
  "curl_cffi==0.16.3",
  "playwright==1.64.1",
  "patchright==1.64.2",
  "msgspec==0.22.0",
  "browserforge==1.2.4",
]

[project.optional-dependencies]
test = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["adapters*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
