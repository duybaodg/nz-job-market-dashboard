server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Round 15 (M-12): defence-in-depth headers. TLS is terminated upstream at
    # Cloudflare; LAN HTTP is intentionally kept, so no HSTS here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:5050 http://127.0.0.1:5050; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Proxy API calls to the backend container (same docker network).
    # Resolve at runtime so a recreated backend (new container IP) never
    # leaves nginx pointing at a dead address (Docker embedded DNS: 127.0.0.11).
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
   